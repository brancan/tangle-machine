name: Deploy gallery to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "scripts/**", ".github/workflows/pages.yml"]
  # Rebuild the public gallery (web/showcase.json) when Gallery posts change.
  discussion:
    types: [created, edited, deleted, category_changed, labeled, unlabeled, locked, unlocked]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  discussions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: sitemap.xml takes each page's lastmod from git log.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Never fails: without a token, the category or the network it writes an empty gallery.
      - name: Build showcase.json
        run: node scripts/build-showcase.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Fails the deploy on any error: the painting pages are what search engines index.
      - name: Build painting pages, sitemap.xml and llms.txt
        run: node scripts/build-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
